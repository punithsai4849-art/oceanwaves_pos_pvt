# -----------------------------------------------------------------------------
# NGINX CONFIG - Optimized for 1 OCPU / 1GB RAM
# -----------------------------------------------------------------------------

# Rate limiting to protect the 1 OCPU from bots/floods
limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

server {
    listen 80;
    server_name _; # Change this to your domain later

    # Gzip for speed
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Protect against HTTP slow attacks
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Static Files (Fast OS-level serving)
    location /static/ {
        alias /home/ubuntu/ocnwvs/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media Files
    location /media/ {
        alias /home/ubuntu/ocnwvs/media/;
    }

    # Proxy to Gunicorn
    location / {
        limit_req zone=one burst=15 nodelay;
        
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffer settings to protect Django from slow connections
        proxy_buffers 8 16k;
        proxy_buffer_size 32k;
    }
}
